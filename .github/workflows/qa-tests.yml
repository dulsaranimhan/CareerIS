# EC4206 Section 3.6 - CI pipeline: runs every automated test on each push / pull request.
# Owner: EG/2023/5712 - Madhusanka E.M.P
name: CareerIS QA Tests

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests (JUnit, REST Assured, Cucumber) + coverage
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017/careeris_test
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so SonarCloud can show new-code metrics

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run all tests and build the JaCoCo coverage report
        working-directory: backend
        run: mvn -B verify

      - name: Upload test, BDD and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
            backend/target/cucumber-report.html

      - name: SonarCloud analysis (runs only when the SONAR_TOKEN secret is set)
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: backend
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=$SONAR_ORGANIZATION
          -Dsonar.projectKey=$SONAR_PROJECT_KEY

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: npm ci && npm run build
