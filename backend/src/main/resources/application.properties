spring.application.name=careeris-api
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/careeris}
spring.data.mongodb.auto-index-creation=true
server.port=${PORT:8080}
app.security.jwt-secret=${JWT_SECRET:}
spring.servlet.multipart.max-file-size=5MB
# BUG-01 fix: the request also carries multipart headers/boundaries, so it must be larger than the 5 MB file limit
spring.servlet.multipart.max-request-size=6MB
